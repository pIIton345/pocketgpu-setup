name: test
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the tests with Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\run-tests.ps1 -Work "%RUNNER_TEMP%\pgpu-tests"
      - name: Keep the test folders when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-work
          path: ${{ runner.temp }}/pgpu-tests
          retention-days: 7
