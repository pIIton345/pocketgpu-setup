name: Bug report / 不具合の報告
description: Something did not work. / うまく動かなかった。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        (draft / 仮) Do not paste your passphrase, user name, PC name or folder path. Fix-PocketGPU.cmd already leaves them out.
        合言葉・ユーザー名・PC 名・フォルダの場所は貼らないでください。Fix-PocketGPU.cmd の結果には入っていません。
  - type: dropdown
    id: phone_kind
    attributes:
      label: Phone / スマートフォン
      options:
        - iPhone
        - iPad
        - Android
        - Linux (SteamOS etc.)
        - Other
    validations:
      required: true
  - type: input
    id: phone_model
    attributes:
      label: Model and OS version / 機種と OS のバージョン
      placeholder: "iPhone 17 Pro, iOS 26.0  /  Pixel 8, Android 15"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build / Windows のバージョンとビルド
      placeholder: "Windows 11, build 26100"
    validations:
      required: true
  - type: input
    id: kit_version
    attributes:
      label: Kit version / キットの版
      description: "The app= number in tools\kit.ini, or the RpcServer-x.y.z.ipa in the kit folder. / tools\kit.ini の app= の数、またはキットのフォルダの RpcServer-x.y.z.ipa"
      placeholder: "0.7.58"
    validations:
      required: true
  - type: textarea
    id: fix_result
    attributes:
      label: Result of Fix-PocketGPU / Fix-PocketGPU の結果
      description: "Paste the whole text of pocketgpu-fix-summary.txt (the summary Fix-PocketGPU.cmd prints at the end). / Fix-PocketGPU.cmd が最後に出すまとめ（pocketgpu-fix-summary.txt）を、そのまま貼ってください。"
      render: text
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened / 何が起きたか
      description: What you did, what you expected, and what you saw. / したこと、期待したこと、見えたこと。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 個人情報の確認
      options:
        - label: I did not paste a passphrase, a user name, a PC name or a folder path. / 合言葉・ユーザー名・PC 名・フォルダの場所を貼っていません。
          required: true
